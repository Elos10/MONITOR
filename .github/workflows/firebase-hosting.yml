name: Publicar projeto SEMED Gestao no Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_DEPLOY_PROJECT: semed-gestao
  FIREBASE_WEB_API_KEY: AIzaSyBG4xz_7UjlODQmBGkOPQhGN_fjREMUjZM
  FIREBASE_WEB_AUTH_DOMAIN: semed-gestao.firebaseapp.com
  FIREBASE_WEB_STORAGE_BUCKET: semed-gestao.firebasestorage.app
  FIREBASE_WEB_MESSAGING_SENDER_ID: '998882664182'
  FIREBASE_WEB_APP_ID: '1:998882664182:web:40ee419bf6bc0fe1be56d7'
  FIREBASE_WEB_MEASUREMENT_ID: G-H4G35QX9QR

jobs:
  deploy:
    name: Implantar
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar conta de servico
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEMED_GESTAO }}
        run: |
          node <<'NODE'
          const value = process.env.SERVICE_ACCOUNT;
          if (!value) {
            console.error('::error::Crie o Repository Secret FIREBASE_SERVICE_ACCOUNT_SEMED_GESTAO com o JSON completo da conta de servico.');
            process.exit(1);
          }
          let credential;
          try {
            credential = JSON.parse(value);
          } catch {
            console.error('::error::FIREBASE_SERVICE_ACCOUNT_SEMED_GESTAO nao contem um JSON valido. Cole o conteudo do arquivo, nao o caminho de Downloads.');
            process.exit(1);
          }
          const required = ['type', 'project_id', 'private_key_id', 'private_key', 'client_email'];
          const missing = required.filter((key) => !credential[key]);
          if (credential.type !== 'service_account' || missing.length) {
            console.error(`::error::A conta de servico esta incompleta. Campos ausentes: ${missing.join(', ') || 'type invalido'}.`);
            process.exit(1);
          }
          if (credential.project_id !== process.env.FIREBASE_DEPLOY_PROJECT) {
            console.error(`::error::O JSON pertence ao projeto ${credential.project_id}, mas o deploy esta configurado para ${process.env.FIREBASE_DEPLOY_PROJECT}.`);
            process.exit(1);
          }
          console.log(`Conta de servico confirmada para ${credential.project_id}.`);
          NODE

      - name: Preparar credencial
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEMED_GESTAO }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const credential = JSON.parse(process.env.SERVICE_ACCOUNT);
          credential.private_key = credential.private_key.replace(/\\n/g, '\n').replace(/\r/g, '').trim() + '\n';
          const credentialPath = path.join(process.env.RUNNER_TEMP, 'semed-gestao-service-account.json');
          fs.writeFileSync(credentialPath, JSON.stringify(credential));
          fs.appendFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${credentialPath}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `GOOGLE_CLOUD_PROJECT=${credential.project_id}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `GCLOUD_PROJECT=${credential.project_id}\n`);
          NODE

      - name: Validar chave privada ativa
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          (async () => {
            const credential = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8'));
            const url = credential.client_x509_cert_url || `https://www.googleapis.com/robot/v1/metadata/x509/${encodeURIComponent(credential.client_email)}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error('Nao foi possivel consultar a conta de servico no Google.');
            const certificates = await response.json();
            const certificate = certificates[credential.private_key_id];
            if (!certificate) throw new Error('A chave nao esta ativa. Gere um novo JSON no projeto semed-gestao.');
            const localKey = crypto.createPublicKey(credential.private_key).export({ type: 'spki', format: 'der' });
            const remoteKey = new crypto.X509Certificate(certificate).publicKey.export({ type: 'spki', format: 'der' });
            if (!localKey.equals(remoteKey)) throw new Error('A chave privada nao corresponde a conta de servico cadastrada.');
            console.log('Chave privada valida e ativa.');
          })().catch((error) => {
            console.error(`::error::${error.message}`);
            process.exit(1);
          });
          NODE

      - name: Gerar configuracao Web
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = {
            apiKey: process.env.FIREBASE_WEB_API_KEY,
            authDomain: process.env.FIREBASE_WEB_AUTH_DOMAIN,
            projectId: process.env.FIREBASE_DEPLOY_PROJECT,
            storageBucket: process.env.FIREBASE_WEB_STORAGE_BUCKET,
            messagingSenderId: process.env.FIREBASE_WEB_MESSAGING_SENDER_ID,
            appId: process.env.FIREBASE_WEB_APP_ID,
            measurementId: process.env.FIREBASE_WEB_MEASUREMENT_ID
          };
          fs.writeFileSync('firebase-config.js', `window.SEMED_FIREBASE_CONFIG = ${JSON.stringify(config, null, 2)};\n`);
          NODE

      - name: Instalar ferramentas
        run: |
          npm install --prefix functions
          npm install --global firebase-tools
          firebase --version

      - name: Implantar
        run: firebase deploy --only hosting,functions,firestore:rules,firestore:indexes,storage --project "$FIREBASE_DEPLOY_PROJECT" --non-interactive
