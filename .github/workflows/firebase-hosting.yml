name: Publicar no Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar chaves obrigatórias
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          node -e "for(const k of ['FIREBASE_PROJECT_ID','FIREBASE_SERVICE_ACCOUNT','FIREBASE_API_KEY','FIREBASE_APP_ID','FIREBASE_MESSAGING_SENDER_ID'])if(!process.env[k]){console.error('Configure o secret '+k);process.exitCode=1}"
          node -e "JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT); console.log('Conta de serviço válida')"

      - name: Autenticar no Google Cloud
        id: firebase_auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Confirmar credencial preparada
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.firebase_auth.outputs.credentials_file_path }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          test -s "$GOOGLE_APPLICATION_CREDENTIALS"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));if(c.project_id!==process.env.FIREBASE_PROJECT_ID){console.error('O project_id da conta de serviço não corresponde ao FIREBASE_PROJECT_ID');process.exit(1)}console.log('Credencial preparada para '+c.project_id)"

      - name: Gerar configuração Web
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          node -e "const fs=require('fs');const p=process.env.FIREBASE_PROJECT_ID;const c={apiKey:process.env.FIREBASE_API_KEY,authDomain:p+'.firebaseapp.com',projectId:p,storageBucket:p+'.firebasestorage.app',messagingSenderId:process.env.FIREBASE_MESSAGING_SENDER_ID,appId:process.env.FIREBASE_APP_ID};fs.writeFileSync('firebase-config.js','window.SEMED_FIREBASE_CONFIG = '+JSON.stringify(c,null,2)+';\n')"

      - name: Instalar dependências
        run: |
          npm install --prefix functions
          npm install --global firebase-tools

      - name: Implantar
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.firebase_auth.outputs.credentials_file_path }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          GCLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: firebase deploy --only hosting,functions,firestore:rules,firestore:indexes,storage --project "$FIREBASE_PROJECT_ID" --non-interactive
