name: Publicar no Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validar configuração e preparar credencial
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          for name in FIREBASE_PROJECT_ID FIREBASE_SERVICE_ACCOUNT FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_MESSAGING_SENDER_ID; do
            test -n "${!name}" || (echo "::error::Configure o secret $name" && exit 1)
          done
          node <<'NODE'
          const fs = require('fs');
          let raw = (process.env.FIREBASE_SERVICE_ACCOUNT || '').replace(/^\uFEFF/, '').trim();
          const attempts = [raw];
          try {
            const decoded = Buffer.from(raw, 'base64').toString('utf8').replace(/^\uFEFF/, '').trim();
            if (decoded.startsWith('{')) attempts.push(decoded);
          } catch {}
          let account;
          for (const value of attempts) {
            try {
              account = JSON.parse(value);
              if (typeof account === 'string') account = JSON.parse(account);
              if (account && typeof account === 'object') break;
            } catch {
              account = null;
            }
          }
          const valid = account?.type === 'service_account'
            && account.project_id
            && account.private_key
            && account.client_email;
          if (!valid) {
            console.error('::error::FIREBASE_SERVICE_ACCOUNT inválido. Cole o conteúdo completo do JSON ou seu conteúdo em Base64.');
            process.exit(1);
          }
          if (account.project_id !== process.env.FIREBASE_PROJECT_ID) {
            console.error(`::error::O projeto da conta de serviço (${account.project_id}) é diferente de FIREBASE_PROJECT_ID.`);
            process.exit(1);
          }
          const path = `${process.env.RUNNER_TEMP}/firebase-service-account.json`;
          fs.writeFileSync(path, JSON.stringify(account), { mode: 0o600 });
          console.log(`Credencial preparada para o projeto ${account.project_id}.`);
          NODE

      - name: Gerar configuração web
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          cat > firebase-config.js <<EOF
          window.SEMED_FIREBASE_CONFIG = {
            apiKey: "$FIREBASE_API_KEY",
            authDomain: "$FIREBASE_PROJECT_ID.firebaseapp.com",
            projectId: "$FIREBASE_PROJECT_ID",
            storageBucket: "$FIREBASE_PROJECT_ID.firebasestorage.app",
            messagingSenderId: "$FIREBASE_MESSAGING_SENDER_ID",
            appId: "$FIREBASE_APP_ID"
          };
          EOF

      - name: Publicar aplicação, funções, regras e índices
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          GCLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          test -s "$GOOGLE_APPLICATION_CREDENTIALS" || (echo "::error::O arquivo de credencial não foi criado" && exit 1)
          npx --yes firebase-tools@latest deploy --only hosting,functions,firestore:rules,firestore:indexes,storage --project "$FIREBASE_PROJECT_ID" --non-interactive
