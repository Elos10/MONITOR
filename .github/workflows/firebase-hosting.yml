name: Publicar no Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar chaves obrigatórias
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          node -e "for(const k of ['FIREBASE_PROJECT_ID','FIREBASE_SERVICE_ACCOUNT','FIREBASE_API_KEY','FIREBASE_APP_ID','FIREBASE_MESSAGING_SENDER_ID'])if(!process.env[k]){console.error('Configure o secret '+k);process.exitCode=1}"
          node -e "JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT); console.log('Conta de serviço válida')"

      - name: Preparar credencial ADC do Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          node -e "const fs=require('fs');const path=require('path');const c=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);if(c.type!=='service_account'||!c.private_key||!c.private_key_id||!c.client_email){console.error('FIREBASE_SERVICE_ACCOUNT não é um JSON de conta de serviço válido');process.exit(1)}if(c.project_id!==process.env.FIREBASE_PROJECT_ID){console.error('O project_id da conta de serviço não corresponde ao FIREBASE_PROJECT_ID');process.exit(1)}c.private_key=c.private_key.replace(/\\n/g,'\n').replace(/\r/g,'').trim()+'\n';const file=path.join(process.env.RUNNER_TEMP,'firebase-service-account.json');fs.writeFileSync(file,JSON.stringify(c));fs.appendFileSync(process.env.GITHUB_ENV,'GOOGLE_APPLICATION_CREDENTIALS='+file+'\nGOOGLE_CLOUD_PROJECT='+c.project_id+'\nGCLOUD_PROJECT='+c.project_id+'\n');console.log('ADC preparada para '+c.project_id)"

      - name: Validar assinatura da conta de serviço
        run: |
          node -e "const fs=require('fs'),crypto=require('crypto');(async()=>{const c=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));const url=c.client_x509_cert_url||('https://www.googleapis.com/robot/v1/metadata/x509/'+encodeURIComponent(c.client_email));const response=await fetch(url);if(!response.ok)throw new Error('Não foi possível consultar as chaves públicas da conta de serviço');const certificates=await response.json(),certificate=certificates[c.private_key_id];if(!certificate)throw new Error('A private_key_id não está ativa para '+c.client_email+'. Gere uma nova chave JSON');const privatePublic=crypto.createPublicKey(c.private_key).export({type:'spki',format:'der'}),registeredPublic=new crypto.X509Certificate(certificate).publicKey.export({type:'spki',format:'der'});if(!privatePublic.equals(registeredPublic))throw new Error('A private_key não corresponde ao client_email/private_key_id. Substitua FIREBASE_SERVICE_ACCOUNT pelo JSON original completo');console.log('Assinatura confirmada para '+c.client_email)})().catch(error=>{console.error('::error::'+error.message);process.exit(1)})"

      - name: Gerar configuração Web
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          node -e "const fs=require('fs');const p=process.env.FIREBASE_PROJECT_ID;const c={apiKey:process.env.FIREBASE_API_KEY,authDomain:p+'.firebaseapp.com',projectId:p,storageBucket:p+'.firebasestorage.app',messagingSenderId:process.env.FIREBASE_MESSAGING_SENDER_ID,appId:process.env.FIREBASE_APP_ID};fs.writeFileSync('firebase-config.js','window.SEMED_FIREBASE_CONFIG = '+JSON.stringify(c,null,2)+';\n')"

      - name: Instalar dependências
        run: |
          npm install --prefix functions
          npm install --global firebase-tools

      - name: Verificar Firebase CLI e autenticação ADC
        run: |
          firebase --version
          test -s "$GOOGLE_APPLICATION_CREDENTIALS"
          node -e "const c=require(process.env.GOOGLE_APPLICATION_CREDENTIALS);console.log('Conta: '+c.client_email);console.log('Projeto: '+c.project_id)"

      - name: Implantar
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: firebase deploy --only hosting,functions,firestore:rules,firestore:indexes,storage --project "$FIREBASE_PROJECT_ID" --non-interactive --debug
